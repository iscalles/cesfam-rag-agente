  <rect x="920" y="566" width="250" height="70" rx="8" fill="#FFFFFF" stroke="#E4572E"/>
  <text x="1045" y="594" text-anchor="middle" fill="#16302F" font-weight="700">guardar_documento</text>
  <text x="1045" y="616" text-anchor="middle" fill="#4B6668" font-size="12.5">material, fichas, resúmenes</text>
  <rect x="1190" y="566" width="250" height="70" rx="8" fill="#FFFFFF" stroke="#E4572E"/>
  <text x="1315" y="594" text-anchor="middle" fill="#16302F" font-weight="700">registrar_consulta_pendiente</text>
  <text x="1315" y="616" text-anchor="middle" fill="#4B6668" font-size="12.5">vacíos de la base documental</text>
  <rect x="1055" y="656" width="250" height="70" rx="8" fill="#FFFFFF" stroke="#E4572E"/>
  <text x="1180" y="684" text-anchor="middle" fill="#16302F" font-weight="700">recordar_preferencia</text>
  <text x="1180" y="706" text-anchor="middle" fill="#4B6668" font-size="12.5">memoria de largo plazo</text>

