<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 1500 1074" width="1500" height="1074" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4B6668"/>
    </marker>
  </defs>
  <rect y="-14" width="1500" height="1074" fill="#FFFFFF"/>

  <!-- ===== Fila 1: entrada ===== -->
  <rect x="40" y="36" width="190" height="56" rx="28" fill="#EAF6F6" stroke="#04555C" stroke-width="1.5"/>
  <text x="135" y="69" text-anchor="middle" fill="#16302F" font-weight="700">Personal CESFAM</text>

  <rect x="290" y="36" width="240" height="56" rx="8" fill="#EAF6F6" stroke="#04555C" stroke-width="1.5"/>
  <text x="410" y="60" text-anchor="middle" fill="#16302F" font-weight="700">Login usuario / rol</text>
  <text x="410" y="80" text-anchor="middle" fill="#4B6668" font-size="12.5">src/auth.py</text>

  <rect x="590" y="36" width="270" height="56" rx="8" fill="#EAF6F6" stroke="#04555C" stroke-width="1.5"/>
  <text x="725" y="60" text-anchor="middle" fill="#16302F" font-weight="700">Interfaz de chat (Streamlit)</text>
  <text x="725" y="80" text-anchor="middle" fill="#4B6668" font-size="12.5">app.py · panel de razonamiento</text>

  <rect x="920" y="36" width="260" height="56" rx="8" fill="#EAF6F6" stroke="#04555C" stroke-width="1.5"/>
  <text x="1050" y="60" text-anchor="middle" fill="#16302F" font-weight="700">Privacidad: RUT omitido</text>
  <text x="1050" y="80" text-anchor="middle" fill="#4B6668" font-size="12.5">src/privacidad.py</text>

  <g fill="none" stroke="#4B6668" stroke-width="1.5">
    <path d="M230 64H286" marker-end="url(#f)"/>
    <path d="M530 64H586" marker-end="url(#f)"/>
    <path d="M860 64H916" marker-end="url(#f)"/>
    <path d="M1050 92V136" marker-end="url(#f)"/>
  </g>
  <text x="888" y="56" text-anchor="middle" fill="#4B6668" font-size="12">pregunta</text>

  <!-- ===== Fila 2: agente ===== -->
  <rect x="40" y="140" width="1140" height="330" rx="12" fill="#F7FBFB" stroke="#04555C" stroke-width="2"/>
  <text x="60" y="168" fill="#022F33" font-weight="700" font-size="16">Agente CESFAM · LangChain create_agent sobre LangGraph · src/agente.py</text>

  <rect x="60" y="186" width="470" height="266" rx="8" fill="#FFFFFF" stroke="#9CC9C9" stroke-width="1.25"/>
  <text x="80" y="212" fill="#04555C" font-weight="700">Middleware, en el orden en que se aplica</text>
  <g fill="#16302F" font-size="13.5">
    <text x="80" y="242"><tspan font-weight="700">1 PII</tspan> — omite RUT antes del modelo</text>
    <text x="80" y="271"><tspan font-weight="700">2 Prompt dinámico</tspan> — reglas + permisos del rol + memoria</text>
    <text x="80" y="300"><tspan font-weight="700">3 TodoList</tspan> — herramienta write_todos para planificar</text>
    <text x="80" y="329"><tspan font-weight="700">4 Summarization</tspan> — resume conversaciones largas</text>
    <text x="80" y="358"><tspan font-weight="700">5 ModelCallLimit</tspan> — máx. 10 llamadas por pregunta</text>
    <text x="80" y="387"><tspan font-weight="700">6 ModelRetry</tspan> — reintenta con espera creciente</text>
    <text x="80" y="416"><tspan font-weight="700">7 ModelFallback</tspan> — cambia al modelo de respaldo</text>
  </g>
  <text x="80" y="441" fill="#4B6668" font-size="12">Sólo los resultados de las herramientas llegan al LLM como contexto.</text>

  <rect x="580" y="226" width="300" height="126" rx="10" fill="#04555C" stroke="#022F33" stroke-width="1.5"/>
  <text x="730" y="256" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="16">LLM Mistral</text>
  <text x="730" y="280" text-anchor="middle" fill="#EAF6F6">decide el siguiente paso</text>
  <text x="730" y="310" text-anchor="middle" fill="#EAF6F6" font-size="12.5">principal: mistral-small-latest</text>
  <text x="730" y="330" text-anchor="middle" fill="#EAF6F6" font-size="12.5">respaldo: ministral-8b-latest</text>

  <rect x="920" y="226" width="240" height="126" rx="10" fill="#00A896" stroke="#04555C" stroke-width="1.5"/>
  <text x="1040" y="258" text-anchor="middle" fill="#FFFFFF" font-weight="700">Memoria de corto plazo</text>
  <text x="1040" y="284" text-anchor="middle" fill="#FFFFFF" font-size="13">checkpointer por sesión</text>
  <text x="1040" y="304" text-anchor="middle" fill="#FFFFFF" font-size="13">(InMemorySaver, thread_id)</text>
  <text x="1040" y="328" text-anchor="middle" fill="#FFFFFF" font-size="13">+ resumen automático</text>

  <g fill="none" stroke="#4B6668" stroke-width="1.5">
    <path d="M530 289H576" marker-end="url(#f)"/>
    <path d="M884 289H916" marker-start="url(#f)" marker-end="url(#f)"/>
  </g>

  <!-- Garantías y log -->
  <rect x="1230" y="186" width="230" height="98" rx="8" fill="#FFF4EE" stroke="#E4572E" stroke-width="1.5"/>
  <text x="1345" y="214" text-anchor="middle" fill="#16302F" font-weight="700">Garantías deterministas</text>
  <text x="1345" y="240" text-anchor="middle" fill="#16302F" font-size="13">guardrail final (sin respaldo</text>
  <text x="1345" y="258" text-anchor="middle" fill="#16302F" font-size="13">→ mensaje fijo) · aviso</text>
  <text x="1345" y="276" text-anchor="middle" fill="#16302F" font-size="13">de vigencia antigua</text>

  <path d="M1250 342 a95 12 0 0 0 190 0 v54 a95 12 0 0 1 -190 0z" fill="#00A896" stroke="#04555C" stroke-width="1.25"/>
  <ellipse cx="1345" cy="342" rx="95" ry="12" fill="#2BB9A9" stroke="#04555C" stroke-width="1.25"/>
  <text x="1345" y="384" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">logs/trazabilidad.jsonl</text>

  <g fill="none" stroke="#4B6668" stroke-width="1.5">
    <path d="M1180 235H1226" marker-end="url(#f)"/>
    <path d="M1345 284V326" marker-end="url(#f)"/>
    <path d="M1345 186V16H725V32" marker-end="url(#f)"/>
  </g>
  <text x="1035" y="9" text-anchor="middle" fill="#4B6668" font-size="12">respuesta + fuentes + decisiones del agente</text>

  <!-- ===== Fila 3: herramientas ===== -->
  <g fill="none" stroke="#4B6668" stroke-width="1.5">
    <path d="M255 474V516" marker-start="url(#f)" marker-end="url(#f)"/>
    <path d="M685 474V516" marker-start="url(#f)" marker-end="url(#f)"/>
    <path d="M1100 474V516" marker-start="url(#f)" marker-end="url(#f)"/>
  </g>
  <text x="700" y="500" fill="#4B6668" font-size="12">el LLM elige la herramienta y recibe su resultado</text>

  <!-- CONSULTA -->
  <rect x="40" y="520" width="430" height="226" rx="10" fill="#F4FBFB" stroke="#00A896" stroke-width="1.5"/>
  <text x="255" y="548" text-anchor="middle" fill="#04555C" font-weight="700" font-size="15">CONSULTA</text>
  <rect x="60" y="566" width="390" height="70" rx="8" fill="#FFFFFF" stroke="#00A896"/>
  <text x="255" y="594" text-anchor="middle" fill="#16302F" font-weight="700">buscar_procedimientos_internos</text>
  <text x="255" y="616" text-anchor="middle" fill="#4B6668" font-size="12.5">manual + FAQ · índice interno</text>
  <rect x="60" y="656" width="390" height="70" rx="8" fill="#FFFFFF" stroke="#00A896"/>
  <text x="255" y="684" text-anchor="middle" fill="#16302F" font-weight="700">buscar_guias_minsal</text>
  <text x="255" y="706" text-anchor="middle" fill="#4B6668" font-size="12.5">GES HTA y DM2 + PNI · solo rol clínico</text>

  <!-- RAZONAMIENTO -->
  <rect x="510" y="520" width="350" height="226" rx="10" fill="#F7F6FC" stroke="#5B4FA8" stroke-width="1.5"/>
  <text x="685" y="548" text-anchor="middle" fill="#3F3680" font-weight="700" font-size="15">RAZONAMIENTO</text>
  <rect x="530" y="566" width="310" height="70" rx="8" fill="#FFFFFF" stroke="#5B4FA8"/>
  <text x="685" y="594" text-anchor="middle" fill="#16302F" font-weight="700">verificar_vigencia</text>
  <text x="685" y="616" text-anchor="middle" fill="#4B6668" font-size="12.5">calcula la antigüedad del documento</text>
  <rect x="530" y="656" width="310" height="70" rx="8" fill="#FFFFFF" stroke="#5B4FA8"/>
  <text x="685" y="684" text-anchor="middle" fill="#16302F" font-weight="700">write_todos</text>
  <text x="685" y="706" text-anchor="middle" fill="#4B6668" font-size="12.5">plan de pasos y su avance</text>

  <!-- ESCRITURA -->
  <rect x="900" y="520" width="560" height="226" rx="10" fill="#FFF8F4" stroke="#E4572E" stroke-width="1.5"/>
